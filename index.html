<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Dini.</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#080808;
    color:#fff;
    font-family:Georgia,serif;
    min-height:100vh;
    overflow:hidden;
}

.page{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:30px;
}

.opening{
    animation:fade 2s ease;
}

.name{
    font-size:clamp(55px,16vw,110px);
    letter-spacing:18px;
    margin-left:18px;
    font-weight:400;
}

.subtitle{
    margin-top:20px;
    color:#888;
    font-family:Arial,sans-serif;
    font-size:11px;
    letter-spacing:4px;
    text-transform:uppercase;
}

.enter{
    margin-top:55px;
    padding:15px 38px;
    background:transparent;
    color:white;
    border:1px solid #555;
    font-size:11px;
    letter-spacing:4px;
    cursor:pointer;
    transition:.4s;
}

.enter:hover{
    background:white;
    color:#000;
}

.story{
    display:none;
    max-width:650px;
    animation:fade 1.5s ease;
}

.story.show{
    display:block;
}

.small{
    color:#888;
    font-family:Arial,sans-serif;
    font-size:10px;
    letter-spacing:4px;
    text-transform:uppercase;
    margin-bottom:25px;
}

.message{
    font-size:clamp(22px,5vw,34px);
    line-height:1.6;
    font-weight:400;
}

.signature{
    margin-top:35px;
    color:#888;
    font-size:14px;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="opening" id="opening">
        <div class="name">DINI</div>

        <div class="subtitle">
            there's something I never said.
        </div>

        <button class="enter" id="enterButton">
            ENTER
        </button>
    </div>

    <div class="story" id="story">

        <div class="small">
            for someone special
        </div>

        <div class="message">
            Ada sesuatu yang sebenarnya
            sudah cukup lama ingin aku sampaikan.
            <br><br>
            Tapi mungkin aku terlalu takut
            untuk mengatakannya secara langsung.
        </div>

        <div class="signature">
            — Andika
        </div>

    </div>

</div>

<script>
document.getElementById("enterButton").addEventListener("click", function(){

    document.getElementById("opening").style.display = "none";

    document.getElementById("story").classList.add("show");

});
</script>

</body>
</html>
